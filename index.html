<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SkyPlan POC — chart / 3D / FOV</title>
<style>
  :root{
    --ink:#ff9a76; --ink-dim:#a8543c; --hot:#ffcf6b; --edge:#43170f;
    --panel:#0d0301; --panel2:#120402; --moon:#8fb4dd;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  header{display:flex;gap:14px;align-items:center;padding:8px 14px;
    border-bottom:1px solid var(--edge);background:var(--panel2);flex:0 0 auto}
  header h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-dim);font-weight:600;margin:0 6px 0 0}
  header .grp{display:flex;gap:6px;align-items:center}
  header label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-dim)}
  select,input[type=date],input[type=number]{background:var(--panel);color:var(--ink);border:1px solid var(--edge);
    border-radius:2px;padding:5px 7px;font-family:var(--mono);font-size:12px;cursor:pointer}
  input[type=range]{-webkit-appearance:none;background:transparent;height:20px}
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--edge)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-6px;
    border-radius:50%;background:var(--hot);border:2px solid #000}
  button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--edge);
    border-radius:2px;padding:6px 9px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--ink-dim)}
  button.on{color:#000;background:var(--hot);border-color:var(--hot);font-weight:600}
  header .spacer{margin-left:auto}
  #clock{font-family:var(--mono);font-size:15px;color:var(--hot);font-weight:600}
  #moonline{font-family:var(--mono);font-size:11px;color:var(--moon)}
  #locPanel{display:none;position:absolute;top:46px;left:150px;z-index:30;width:210px;
    background:var(--panel2);border:1px solid var(--edge);border-radius:3px;padding:11px;
    flex-direction:column;gap:9px}
  #locPanel.show{display:flex}
  #locPanel .fld{display:flex;flex-direction:column;gap:4px}
  #locPanel .lrow{display:flex;gap:6px}
  #locPanel .lrow button{flex:1;padding:6px;font-size:11px}
  #locPanel .lnote{font-family:var(--mono);font-size:10px;color:var(--ink-dim);line-height:1.4}
  #fovCtrls .rigbox{display:flex;flex-direction:column;gap:7px;margin-top:2px;padding-top:9px;border-top:1px solid var(--edge)}
  #fovCtrls .rigrow{display:flex;gap:6px}
  #fovCtrls .rigrow button{flex:1;padding:6px;font-size:11px}
  #fovCtrls #fRig a{color:var(--hot);cursor:pointer;text-decoration:underline}
  #fovCtrls .tiny{padding:5px;font-size:10px;opacity:.85}
  .rigchip{color:var(--hot);font-size:10px;margin-left:3px;letter-spacing:-1px}
  #fovCtrls .navbtn{padding:6px 9px;font-size:12px;background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:2px;cursor:pointer}
  #fovCtrls .navbtn:hover{border-color:var(--ink-dim)}
  #fMini{width:100%;height:64px;display:block;margin:8px 0 2px}
  #fovCtrls .wfrow{display:flex;align-items:center;gap:8px}
  #fovCtrls .wflab{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--ink-dim);width:42px}
  #fovCtrls .seg{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  #fovCtrls .seg button{flex:1;padding:5px;font-size:11px;background:var(--panel);color:var(--ink);
    border:1px solid var(--edge);border-radius:2px;cursor:pointer}
  #fovCtrls .seg button.on{background:var(--hot);color:#000;border-color:var(--hot);font-weight:600}
  .badge.band-NB{background:#3a1230;color:#f9a8d4}.badge.band-BB{background:#33372f;color:#cbd5e1}
  .badge.active{background:#1f3a2a;color:#8fd0a0}.badge.new{background:#33280f;color:#e6c07a}
  .badge.complete{background:#2a2a2a;color:#9aa}.badge.todo{background:#16202e;color:#89aecf}.badge.parked{background:#241a2e;color:#b09ad0}
  #listFilters{display:flex;flex-wrap:wrap;gap:5px;padding:7px 12px;border-bottom:1px solid var(--edge)}
  #listFilters select{flex:1 1 auto;min-width:84px;background:var(--panel);color:var(--ink);
    border:1px solid var(--edge);border-radius:2px;padding:4px 5px;font-family:var(--mono);font-size:11px}
  #listFilters select.set{border-color:var(--ink-dim);color:var(--hot)}
  #listFilters input,#listFilters .fltbtn{background:var(--panel);color:var(--ink);border:1px solid var(--edge);border-radius:2px;padding:4px 6px;font-family:var(--mono);font-size:11px}
  #fltSearch{flex:1 1 100%}
  #listFilters .fltbtn{cursor:pointer;flex:0 0 auto}
  #listFilters .fltbtn.on{background:var(--hot);color:#000;border-color:var(--hot)}
  .row .nm b.fovlink{cursor:pointer}.row .nm b.fovlink:hover{color:var(--hot)}

  main{flex:1 1 auto;display:flex;min-height:0}
  #stage{flex:1 1 auto;position:relative;min-width:0;background:#000}
  #skybg,#big,#al{position:absolute;inset:0;width:100%;height:100%}
  #skybg{display:none}
  #big{display:block}
  #al{display:none}
  #big.chart{cursor:col-resize}#big.sky{cursor:grab}#big.sky:active{cursor:grabbing}
  #mainBar{position:absolute;top:8px;left:10px;display:flex;gap:4px;align-items:center;z-index:3}
  #mainBar button{padding:4px 10px;font-size:11px}
  #mainBar .div{width:1px;height:18px;background:var(--edge);margin:0 3px}
  #pip{position:absolute;top:44px;right:12px;width:250px;height:150px;z-index:3;
    border:1px solid var(--edge);background:#050101;cursor:pointer;display:block}
  #pip:hover{border-color:var(--ink-dim)}
  #pipLbl{position:absolute;top:46px;right:14px;z-index:4;font-family:var(--mono);font-size:9px;
    color:var(--ink-dim);pointer-events:none}
  #lookTxt{position:absolute;bottom:8px;left:12px;font-family:var(--mono);font-size:10px;
    color:var(--ink-dim);pointer-events:none;z-index:3;display:none}
  #fovCtrls{position:absolute;top:44px;left:10px;width:232px;z-index:3;display:none;
    flex-direction:column;gap:9px;background:var(--panel2);border:1px solid var(--edge);
    border-radius:3px;padding:11px}
  #fovCtrls .fld{display:flex;flex-direction:column;gap:4px}
  #fovCtrls .ro{font-family:var(--mono);font-size:11px;line-height:1.6;color:var(--ink)}
  #fovCtrls .ro b{color:var(--hot)}

  aside{flex:0 0 320px;display:flex;flex-direction:column;border-left:1px solid var(--edge);
    background:var(--panel2);min-height:0}
  #listHead{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-dim);border-bottom:1px solid var(--edge)}
  #listHead .mini{display:flex;gap:4px}
  #listHead .mini button{padding:2px 6px;font-size:10px}
  #list{overflow-y:auto;flex:1 1 auto;padding:2px 0}
  .row{display:flex;gap:9px;align-items:center;padding:7px 12px;cursor:pointer;border-bottom:1px solid #1c0805}
  .row:hover{background:var(--panel)}
  .row.off{opacity:.4}
  .row.current{background:rgba(255,207,107,.12);box-shadow:inset 4px 0 0 var(--hot)}
  .row.current .nm b{color:var(--hot)}
  .sw{width:11px;height:11px;border-radius:2px;flex:0 0 auto;box-shadow:0 0 5px currentColor}
  .row .nm{flex:1 1 auto;min-width:0}
  .row .nm b{font-size:13px;font-weight:600;color:var(--ink);display:block;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm small{font-family:var(--mono);font-size:10px;color:var(--ink-dim)}
  .row a.ab{color:var(--ink-dim);text-decoration:none;font-size:13px;padding:0 3px;flex:0 0 auto}
  .row a.ab:hover{color:var(--hot)}
  .row .metric{font-family:var(--mono);font-size:11px;color:var(--hot);text-align:right;flex:0 0 auto;line-height:1.3}
  .row .metric small{color:var(--ink-dim);display:block;font-size:10px}
  .badge{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.06em;
    padding:1px 4px;border:1px solid var(--edge);border-radius:2px;color:var(--ink-dim);flex:0 0 auto}
  .badge.current{color:#7fe0c0;border-color:#2c5a4c}
  .badge.shortlist{color:var(--hot);border-color:#5a4520}

  footer{flex:0 0 auto;display:flex;gap:14px;align-items:center;padding:8px 14px;
    border-top:1px solid var(--edge);background:var(--panel2)}
  #rail{flex:1 1 auto;height:22px}
  #rail::-webkit-slider-thumb{width:18px;height:18px;margin-top:-8px}
  footer .hint{font-family:var(--mono);font-size:10px;color:var(--ink-dim)}
</style>
<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.js" charset="utf-8"></script>
</head>
<body>
<div id="app">
  <header>
    <h1>SkyPlan · POC</h1>
    <div class="grp"><label>Site</label>
      <select id="siteSel">
        <option value="Wheeny">Wheeny Ck (B3/4)</option>
        <option value="Willoughby">Willoughby (B7)</option>
        <option value="Flat">Flat (20° horizon)</option>
        <option value="Custom" id="customOpt" style="display:none">My location</option>
      </select>
      <button id="locBtn" title="Set my location">📍</button></div>
    <div id="locPanel">
      <div class="fld"><label>Latitude</label><input type="number" id="locLat" step="0.0001" value="-33.45"></div>
      <div class="fld"><label>Longitude</label><input type="number" id="locLon" step="0.0001" value="150.80"></div>
      <div class="lrow"><button id="locUse">Use my location</button><button id="locApply">Apply</button></div>
      <div class="lnote" id="locMsg"></div>
    </div>
    <div class="grp"><label>Night of</label><input type="date" id="dateIn" value="2026-09-12"></div>
    <div class="grp"><label>Dark</label>
      <select id="darkSel">
        <option value="-18">Astro −18°</option>
        <option value="-12" selected>Nautical −12°</option>
        <option value="-6">Civil −6°</option>
      </select></div>
    <div class="spacer"></div>
    <div id="moonline"></div>
    <div id="clock">--:--</div>
  </header>

  <main>
    <div id="stage">
      <div id="mainBar">
        <button id="vChart" class="on">Alt-time chart</button>
        <button id="vSky">3D sky</button>
        <button id="vFov">FOV survey</button>
        <span class="div"></span>
        <button id="moonBtn" class="on">Moon glow</button>
        <button id="skyBtn" class="on">Sky image</button>
        <button id="rigBtn">per-rig colours</button>
      </div>
      <canvas id="skybg"></canvas>
      <canvas id="big" class="chart"></canvas>
      <div id="al"></div>
      <canvas id="pip"></canvas>
      <div id="pipLbl"></div>
      <div id="lookTxt"></div>
      <div id="fovCtrls">
        <div class="fld"><label>Framed target</label>
          <div style="display:flex;gap:5px;align-items:center">
            <button id="fPrev" class="navbtn" title="Previous target">◀</button>
            <select id="fTgt" style="flex:1;min-width:0"></select>
            <button id="fNext" class="navbtn" title="Next target">▶</button>
          </div>
          <div style="display:flex;gap:6px;margin-top:5px">
            <button id="tgtRename" class="tiny" style="flex:1">✎ rename</button>
            <button id="tgtDelete" class="tiny" style="flex:1">🗑 remove</button>
          </div></div>
        <div class="fld"><label>Scope</label>
          <select id="fScope">
            <option value="rc61">RedCat 61 · 300 mm</option>
            <option value="a91f">Askar 91F · 609 mm</option>
            <option value="p200" selected>200PDS · 950 mm</option>
          </select></div>
        <div class="fld"><label>Camera</label>
          <select id="fCam">
            <option value="a585">ASI585</option>
            <option value="a2600" selected>ASI2600</option>
            <option value="a1600">ASI1600MM</option>
          </select></div>
        <div class="fld"><label>PA <span id="fPaTxt">0°</span></label>
          <input type="range" id="fPa" min="0" max="180" value="0" style="width:100%"></div>
        <div class="ro" id="fRo">—</div>
        <canvas id="fMini" title="Tonight's altitude curve"></canvas>
        <div class="rigbox">
          <div class="rigrow">
            <button id="setPri" title="Save current scope + camera as this target's primary rig">★ set primary</button>
            <button id="setBak" title="Save current scope + camera as this target's backup rig">☆ set backup</button>
          </div>
          <div class="ro" id="fRig">—</div>
          <div class="wfrow"><span class="wflab">band</span>
            <div class="seg" id="bandSeg"><button data-b="NB">NB</button><button data-b="BB">BB</button></div></div>
          <div class="wfrow"><span class="wflab">status</span>
            <div class="seg" id="statSeg"><button data-s="todo">todo</button><button data-s="new">new</button><button data-s="active">active</button><button data-s="complete">done</button><button data-s="parked">parked</button></div></div>
          <div class="tiny" style="opacity:.7;margin:-2px 0 1px">assignments auto-save on this device</div>
          <button id="wfExport" class="tiny">⬇ export workflow.json</button>
          <button id="wfReload" class="tiny">↻ reload workflow from repo (discard local edits)</button>
        </div>
      </div>
    </div>

    <aside>
      <div id="listHead">
        <span id="listCount">Targets</span>
        <span class="mini"><button id="planSave" title="Save the selected targets as a named plan">save plan</button><button id="planLoad" title="Load a saved plan">load</button><button id="allBtn">all</button><button id="noneBtn">none</button></span>
      </div>
      <input type="file" id="planFile" accept=".json" style="display:none">
      <div id="listFilters">
        <input id="fltSearch" placeholder="🔍 search name…">
        <select id="fltList"><option value="">list ▾</option></select>
        <select id="fltBand"><option value="">band ▾</option><option value="NB">NB</option><option value="BB">BB</option></select>
        <select id="fltStatus"><option value="">status ▾</option><option value="__unset__">— unset —</option><option value="todo">todo</option><option value="new">new</option><option value="active">active</option><option value="complete">done</option><option value="parked">parked</option></select>
        <select id="fltRig"><option value="">rig ▾</option></select>
        <button id="fltSel" class="fltbtn">selected</button>
        <select id="sortSel">
          <option value="dark">sort: dark hrs</option>
          <option value="alt">sort: max alt</option>
          <option value="opp">sort: opposition</option>
          <option value="ra">sort: RA</option>
          <option value="name">sort: name</option>
        </select>
      </div>
      <div id="list"></div>
    </aside>
  </main>

  <footer>
    <button id="playBtn">▶ play</button>
    <input type="range" id="rail" min="0" max="1000" value="500">
    <span class="hint">drag the chart's time line, or this rail</span>
    <span class="hint" style="margin-left:auto;opacity:.8">SkyPlan · v0.17</span>
  </footer>
</div>

const D=Math.PI/180, R2D=180/Math.PI, $=id=>document.getElementById(id);
function jd(d){return d.getTime()/86400000+2440587.5;}
function gmst(j){const T=(j-2451545)/36525;
  let g=280.46061837+360.98564736629*(j-2451545)+0.000387933*T*T-T*T*T/38710000;
  return((g%360)+360)%360;}
function altaz(ra,dec,j,lat,lon){
  const H=((((gmst(j)+lon-ra)%360)+360)%360)*D, dr=dec*D, lr=lat*D;
  const alt=Math.asin(Math.sin(dr)*Math.sin(lr)+Math.cos(dr)*Math.cos(lr)*Math.cos(H));
  let az=Math.atan2(Math.sin(H),Math.cos(H)*Math.sin(lr)-Math.tan(dr)*Math.cos(lr))*R2D+180;
  return{alt:alt*R2D,az:((az%360)+360)%360};
}
function sunRaDec(j){
  const n=j-2451545, L=(280.460+0.9856474*n)%360, g=((357.528+0.9856003*n)%360)*D;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*D, e=23.439*D;
  return{ra:((Math.atan2(Math.cos(e)*Math.sin(lam),Math.cos(lam))*R2D)+360)%360,
         dec:Math.asin(Math.sin(e)*Math.sin(lam))*R2D};
}
function moonRaDec(j){
  const n=j-2451545, L=218.316+13.176396*n, M=(134.963+13.064993*n)*D, F=(93.272+13.229350*n)*D;
  const lam=(L+6.289*Math.sin(M))*D, bet=(5.128*Math.sin(F))*D, e=23.439*D;
  const x=Math.cos(bet)*Math.cos(lam),
        y=Math.cos(e)*Math.cos(bet)*Math.sin(lam)-Math.sin(e)*Math.sin(bet),
        z=Math.sin(e)*Math.cos(bet)*Math.sin(lam)+Math.cos(e)*Math.sin(bet);
  return{ra:((Math.atan2(y,x)*R2D)+360)%360,dec:Math.asin(z)*R2D};
}
function sep(a,b){
  const d1=a.dec*D,d2=b.dec*D,dr=(a.ra-b.ra)*D;
  return Math.acos(Math.max(-1,Math.min(1,
    Math.sin(d1)*Math.sin(d2)+Math.cos(d1)*Math.cos(d2)*Math.cos(dr))))*R2D;
}
function moonLit(j){return (1-Math.cos(sep(moonRaDec(j),sunRaDec(j))*D))/2;}
const C220={T:2461205.6376,a:3.1206573,e:0.5003621,n:0.17878659,
  P:[0.87167131,-0.44908573,-0.19624256],Q:[0.48500176,0.84800108,0.21369946]};
function cometRaDec(j,el){
  const M=(el.n*(j-el.T))*D;
  let E=M; for(let i=0;i<40;i++)E=E-(E-el.e*Math.sin(E)-M)/(1-el.e*Math.cos(E));
  const x=el.a*(Math.cos(E)-el.e), y=el.a*Math.sqrt(1-el.e*el.e)*Math.sin(E);
  const d=j-2451545, g=((357.528+0.9856003*d)%360)*D,
        lam=((280.460+0.9856474*d)%360+1.915*Math.sin(g)+0.020*Math.sin(2*g))*D,
        Rr=1.00014-0.01671*Math.cos(g)-0.00014*Math.cos(2*g), e0=23.439*D;
  const sx=Rr*Math.cos(lam), sy=Rr*Math.cos(e0)*Math.sin(lam), sz=Rr*Math.sin(e0)*Math.sin(lam);
  const X=el.P[0]*x+el.Q[0]*y+sx, Y=el.P[1]*x+el.Q[1]*y+sy, Z=el.P[2]*x+el.Q[2]*y+sz;
  const rr=Math.sqrt(X*X+Y*Y+Z*Z);
  return{ra:((Math.atan2(Y,X)*R2D)%360+360)%360,dec:Math.asin(Z/rr)*R2D,dist:rr};
}

function parseHoriz(txt){
  let pts=txt.trim().split(/\n+/).map(l=>{const [az,alt]=l.trim().split(/\s+/).map(Number);

    g.fillStyle=p.usable?t.color:t.color+"66";g.beginPath();g.arc(px,y(p.alt),p.usable?(mini?3:4):3,0,7);g.fill();}
  if(!mini){g.fillStyle="#8a4526";g.font="10px "+MONO();g.save();g.translate(11,T+ph/2);g.rotate(-Math.PI/2);
    g.textAlign="center";g.textBaseline="middle";g.fillText("ALTITUDE",0,0);g.restore();}
}

/* =========================================================================
   3D SKY  (draws into current context G at W3×H3)
   ========================================================================= */
let G=null,B3=null,FOC3=1,W3=0,H3=0;
function basis3D(){const az=S.look.az*D,al=S.look.alt*D;
  return{f:[Math.cos(al)*Math.sin(az),Math.cos(al)*Math.cos(az),Math.sin(al)],
         r:[Math.cos(az),-Math.sin(az),0],
         u:[-Math.sin(al)*Math.sin(az),-Math.sin(al)*Math.cos(az),Math.cos(al)]};}
function vec3(az,alt){const a=az*D,e=alt*D;return[Math.cos(e)*Math.sin(a),Math.cos(e)*Math.cos(a),Math.sin(e)];}
const dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross3=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
function proj3(v){const z=dot3(v,B3.f); if(z<=0.30)return null;
  const x=W3/2+dot3(v,B3.r)/z*FOC3, y=H3/2-dot3(v,B3.u)/z*FOC3;
  const C=Math.max(W3,H3)*1.5; if(x<-C||x>W3+C||y<-C||y>H3+C)return null; return[x,y];}
function poly3(pts,style,width,dash){G.save();G.strokeStyle=style;G.lineWidth=width;
  if(dash)G.setLineDash(dash);G.beginPath();let pen=false;
  for(const p of pts){if(!p){pen=false;continue;}if(!pen){G.moveTo(p[0],p[1]);pen=true;}else G.lineTo(p[0],p[1]);}
  G.stroke();G.restore();}
function lab3(x,y,t,c,s,al){G.save();G.font=s+"px "+MONO();G.fillStyle=c;
  G.textAlign=al||"center";G.textBaseline="middle";G.fillText(t,x,y);G.restore();}
function moonRingR(Mv,ms,e1,e2,deg){ const th=deg*D,ds=[];
  for(let k=0;k<12;k++){const ph=k/12*2*Math.PI, s=Math.sin(th), ct=Math.cos(th);
    const v=[Mv[0]*ct+(e1[0]*Math.cos(ph)+e2[0]*Math.sin(ph))*s,
             Mv[1]*ct+(e1[1]*Math.cos(ph)+e2[1]*Math.sin(ph))*s,
             Mv[2]*ct+(e1[2]*Math.cos(ph)+e2[2]*Math.sin(ph))*s];
    const p=proj3(v); if(p)ds.push(Math.hypot(p[0]-ms[0],p[1]-ms[1]));}
  if(ds.length<3)return null; ds.sort((a,b)=>a-b); return ds[Math.floor(ds.length/2)];
}
function draw3D(g,W,H,mini){
  G=g;W3=W;H3=H; g.clearRect(0,0,W,H); if(!S.night)return;
  if(!mini)S._skyHits=[];
  B3=basis3D(); FOC3=(H/2)/Math.tan(S.fov3d/2*D);
  const site=S.night.site, j=jd(new Date(S.scrubT)), c={az:S.look.az,alt:S.look.alt};
  // moon avoidance glow (median-sampled radii → no size jump)
  if(S.moonGlow){
    const mrd=moonRaDec(j), m=altaz(mrd.ra,mrd.dec,j,site.lat,site.lon);
    if(m.alt>-2){ const Mv=vec3(m.az,m.alt), msp=proj3(Mv);
      if(msp){ let e1=cross3(Mv,[0,0,1]); const n=Math.hypot(e1[0],e1[1],e1[2]);
        e1=n>1e-6?e1.map(v=>v/n):[1,0,0]; const e2=cross3(Mv,e1);
        const r50=moonRingR(Mv,msp,e1,e2,MOON_NB_DEG);
        if(r50){ let r100=moonRingR(Mv,msp,e1,e2,MOON_BB_DEG); if(!r100)r100=r50*1.9;
          r100=Math.max(r100,r50+2); const diag=Math.hypot(W,H); r100=Math.min(r100,diag);
          const gg=g.createRadialGradient(msp[0],msp[1],1,msp[0],msp[1],r100);
          gg.addColorStop(0,`rgba(150,190,235,${MOON_NB_A})`);
          gg.addColorStop(Math.min(0.98,r50/r100),`rgba(150,190,235,${MOON_NB_A})`);
          gg.addColorStop(Math.min(0.99,r50/r100+0.001),`rgba(150,190,235,${MOON_BB_A})`);
          gg.addColorStop(1,"rgba(150,190,235,0)");
          g.fillStyle=gg;g.beginPath();g.arc(msp[0],msp[1],r100,0,7);g.fill();
          if(!mini){g.strokeStyle="rgba(143,180,221,.28)";g.lineWidth=1;g.setLineDash([4,5]);
            g.beginPath();g.arc(msp[0],msp[1],r50,0,7);g.stroke();g.setLineDash([]);}
        }
      }
    }
  }
  for(let alt=-10;alt<=80;alt+=10){const pts=[];for(let az=0;az<=360;az+=3)pts.push(proj3(vec3(az,alt)));
    const major=alt===0; poly3(pts,major?"#8a3418":"#3a140e",major?2:1,major?null:[3,5]);
    if(!mini&&!major&&alt>0){const p=proj3(vec3(c.az,alt));if(p)lab3(p[0],p[1]-8,alt+"°","#5e2415",10);}}
  for(let az=0;az<360;az+=15){const pts=[];for(let alt=-8;alt<=88;alt+=3)pts.push(proj3(vec3(az,alt)));
    const card=az%90===0,mer=az===0||az===180;
    poly3(pts,mer?"#7a2f5a":(card?"#6a2412":"#33110c"),mer?2:1,mer?[8,6]:null);
    if(az%45===0 && mini){const p=proj3(vec3(az,0));
      if(p)lab3(p[0],p[1]+16,["N","NE","E","SE","S","SW","W","NW"][az/45],card?"#c9603a":"#7a3420",card?13:11);}}
  for(const [nm,ra,dec,mag] of STARS){const q=altaz(ra,dec,j,site.lat,site.lon); if(q.alt<-2)continue;
    const p=proj3(vec3(q.az,q.alt)); if(!p)continue;
    g.beginPath();g.arc(p[0],p[1],Math.max(1.2,3.4-mag*0.7),0,7);g.fillStyle="rgba(255,236,220,.85)";g.fill();
    if(!mini&&mag<1.0)lab3(p[0],p[1]-11,nm,"rgba(255,200,170,.45)",10);}
  {const pts=[];for(let az=0;az<=360;az+=2)pts.push(proj3(vec3(az,horizAlt(az,site.horizon))));poly3(pts,"#ffb066",2.2);}
  const iNow=Math.round((S.scrubT-S.night.start)/(4*60000));
  for(const t of TARGETS){if(!S.enabled.has(t.id))continue;const tk=S.tracks[t.id];if(!tk)continue;
    poly3(tk.pts.map(p=>p.alt>-2?proj3(vec3(p.az,p.alt)):null), t.color+"99", 1.7);
    if(!mini){let lastH=-1; for(const p of tk.pts){ if(p.alt<0)continue; const dd=new Date(p.t);
      if(dd.getHours()!==lastH && dd.getMinutes()<4){ lastH=dd.getHours();
        const q=proj3(vec3(p.az,p.alt)); if(!q)continue;
        g.beginPath();g.arc(q[0],q[1],2.4,0,7);g.fillStyle=p.usable?t.color:"#000";g.strokeStyle=t.color;g.lineWidth=1;g.fill();g.stroke();
        lab3(q[0]+9,q[1],String(lastH).padStart(2,"0")+"h",t.color+"aa",9,"left"); } } }
    const p=tk.pts[iNow];
    if(p&&p.alt>0){const q=proj3(vec3(p.az,p.alt));
      if(q){g.fillStyle=p.usable?t.color:t.color+"66";g.beginPath();g.arc(q[0],q[1],mini?3.5:5,0,7);g.fill();
        g.strokeStyle="#000";g.lineWidth=1.2;g.stroke();
        if(!mini){lab3(q[0],q[1]-12,t.name,t.color,11); S._skyHits.push({ti:TARGETS.indexOf(t),x:q[0],y:q[1]});}}}
  }
  {const mrd=moonRaDec(j),m=altaz(mrd.ra,mrd.dec,j,site.lat,site.lon);
   if(m.alt>-2){const q=proj3(vec3(m.az,m.alt));
     if(q){g.fillStyle="#dfeaf8";g.beginPath();g.arc(q[0],q[1],5,0,7);g.fill();
       if(!mini)lab3(q[0],q[1]-12,Math.round(moonLit(j)*100)+"%","rgba(160,195,235,.7)",10);}}}
  // 20° imaging floor — "viewer sitting at 20°": hide everything below, flat ground
  if(!mini){
    const fp=proj3(vec3(S.look.az,20)); const yF=fp?fp[1]:H*0.62;
    g.fillStyle="rgba(7,3,1,0.6)"; g.fillRect(0,yF,W,H-yF);
    g.strokeStyle="#c98a3a";g.lineWidth=1.6;g.setLineDash([7,5]);
    g.beginPath();g.moveTo(0,yF);g.lineTo(W,yF);g.stroke();g.setLineDash([]);
    g.fillStyle="#c98a3a";g.font="11px "+MONO();g.textAlign="left";g.textBaseline="bottom";
    g.fillText("20° — imaging floor",12,yF-5);
    g.fillStyle="#a8543c";g.font="12px "+MONO();g.textAlign="center";g.textBaseline="top";
    for(let az=0;az<360;az+=45){const p=proj3(vec3(az,20)); if(!p||p[0]<-20||p[0]>W+20)continue;
      g.fillText(["N","NE","E","SE","S","SW","W","NW"][az/45],p[0],yF+5);}
  }
  if(!mini)$("lookTxt").textContent=`look az ${Math.round(c.az)}° alt ${Math.round(c.alt)}° · fov ${S.fov3d}° · drag pan · scroll zoom · glow ${MOON_NB_DEG}°/${MOON_BB_DEG}° · click a target → FOV`;
}

let aladin=null, fovLayer=null, alReady=false;
function fovCorners(cRa,cDec,wDeg,hDeg,paDeg){const a=wDeg/2,b=hDeg/2,pa=paDeg*D,cd=Math.cos(cDec*D)||1;
  return [[-a,-b],[a,-b],[a,b],[-a,b]].map(([u,v])=>{const east=u*Math.cos(pa)+v*Math.sin(pa),north=-u*Math.sin(pa)+v*Math.cos(pa);
    return [cRa+east/cd,cDec+north];});}
function fovCompute(){const sc=SCOPES[S.fov.scope],cm=CAMS[S.fov.cam];
  S.fov.w=2*Math.atan((cm.w/2)/sc.f)*R2D; S.fov.h=2*Math.atan((cm.h/2)/sc.f)*R2D;
  const psc=206.265*cm.px/sc.f, t=TARGETS[S.fov.ti];
  const rk=(S.rank||[]).find(r=>r.id===t.id);
  let opp="";
  if(t.opposition){ const mi=MON[String(t.opposition).toLowerCase()];
    if(mi){ const nowM=new Date(S.night?S.night.start:Date.now()).getMonth()+1; const d=((mi-nowM)+12)%12;
      opp=` · opp ${String(t.opposition).slice(0,3)} ${d===0?"(now)":"(+"+d+"mo)"}`; } }
  const meta=(t.type||"")+(rk?`${t.type?" · ":""}max alt ${Math.round(rk.maxAlt)}° · ${rk.darkH.toFixed(1)}h dark`:"")+opp;
  $("fRo").innerHTML=`<b>${sc.n} + ${cm.n}</b><br>FOV <b>${S.fov.w.toFixed(2)}°×${S.fov.h.toFixed(2)}°</b>
    (${(S.fov.w*60).toFixed(0)}′×${(S.fov.h*60).toFixed(0)}′)<br>scale <b>${psc.toFixed(2)}″/px</b> · ${t.name}`
    +(meta?`<br><span style="color:var(--ink-dim)">${meta}</span>`:"");
  drawMiniChart(t); renderRig();}
function drawMiniChart(t){
  const cv=$("fMini"); if(!cv)return; const g=cv.getContext("2d");
  const DPR=Math.min(devicePixelRatio||1,2), r=cv.getBoundingClientRect();
  const W=Math.max(1,r.width), H=Math.max(1,r.height);
  cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); g.clearRect(0,0,W,H);
  if(!S.night||!S.tracks)return;
  const {start,stop,dusk,dawn}=S.night, tk=S.tracks[t.id];
  const x=ms=>((ms-start)/(stop-start))*(W-2)+1, y=a=>H-3-(Math.max(0,Math.min(90,a))/90)*(H-6);
  g.fillStyle="rgba(18,10,28,.55)"; g.fillRect(x(dusk),0,x(dawn)-x(dusk),H);           // astro-dark window
  g.strokeStyle="#c98a3a";g.setLineDash([4,3]);g.lineWidth=1;g.beginPath();g.moveTo(0,y(20));g.lineTo(W,y(20));g.stroke();g.setLineDash([]);
  g.strokeStyle="#3a140e";g.lineWidth=1;g.beginPath();g.moveTo(0,y(0));g.lineTo(W,y(0));g.stroke();
  if(tk){
    g.strokeStyle=t.color+"55";g.lineWidth=1;g.beginPath();let st=false;
    for(const p of tk.pts){ if(p.alt<-1){st=false;continue;} const px=x(p.t),py=y(p.alt); st?g.lineTo(px,py):g.moveTo(px,py); st=true;} g.stroke();
    g.strokeStyle=t.color;g.lineWidth=2;g.beginPath();st=false;
    for(const p of tk.pts){ if(!p.usable){st=false;continue;} const px=x(p.t),py=y(p.alt); st?g.lineTo(px,py):g.moveTo(px,py); st=true;} g.stroke();
    if(tk.maxT){g.fillStyle=t.color;g.beginPath();g.arc(x(tk.maxT),y(tk.maxAlt),2.5,0,7);g.fill();}
  }
  g.strokeStyle="rgba(255,207,107,.85)";g.lineWidth=1;g.beginPath();g.moveTo(x(S.scrubT),0);g.lineTo(x(S.scrubT),H);g.stroke();
}
/* ---- rig assignment → workflow.json (targets.json stays a clean catalogue) ---- */

function rigKey(r){ return r?r.scope+"_"+r.cam:""; }
function fillFilter(id,vals,cur,labelFn){ const sel=$(id); const ph=sel.options[0]?sel.options[0].outerHTML:"";
  const keep=(sel.id==="fltBand"||sel.id==="fltStatus"); if(keep)return;   // fixed-option filters aren't repopulated

const MON={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
function renderList(){
  const el=$("list");el.innerHTML="";
  let items=S.rank.map(rk=>({rk,t:TARGETS.find(x=>x.id===rk.id)})).filter(o=>o.t);

  fillFilter("fltRig",[...new Set(items.map(o=>rigKey(o.wf.rigPrimary)).filter(Boolean))].sort(),S.flt.rig,
    k=>{const[s,c]=k.split("_");return (SCOPES[s]?SCOPES[s].n:s)+" + "+(CAMS[c]?CAMS[c].n:c);});

    if(f.list&&o.t.list!==f.list)return false;
    if(f.band&&o.wf.band!==f.band)return false;

    if(f.rig&&rigKey(o.wf.rigPrimary)!==f.rig)return false;
    return true;});
  const sorters={ dark:(a,b)=>b.rk.darkH-a.rk.darkH, alt:(a,b)=>b.rk.maxAlt-a.rk.maxAlt,
    ra:(a,b)=>a.t.ra-b.t.ra, name:(a,b)=>a.t.name.localeCompare(b.t.name),
    opp:(a,b)=>(MON[(a.t.opposition||"").toLowerCase()]||99)-(MON[(b.t.opposition||"").toLowerCase()]||99) };
  items.sort(sorters[S.sortSel]||sorters.dark);
  S.viewIds=items.map(o=>o.t.id);
  const anyFlt=f.list||f.band||f.status||f.rig;
  $("listCount").textContent=`Targets · ${items.length}`+(anyFlt?" (filtered)":"");
  ["fltList","fltBand","fltStatus","fltRig"].forEach(id=>$(id).classList.toggle("set",!!$(id).value));
  const curId=TARGETS[S.fov.ti]?TARGETS[S.fov.ti].id:null;
  for(const {rk,t,wf} of items){ const on=S.enabled.has(t.id);
    const row=document.createElement("div");row.className="row"+(on?"":" off")+(t.id===curId?" current":"");
    row.dataset.id=t.id;
    const st=wf.status||t.status;
    const stBadge = st ? `<span class="badge ${st}">${st==="complete"?"done":st.replace("_"," ")}</span>`
                       : (t.kind==="comet"?'<span class="badge">comet</span>':"");
    const badge=(wf.band?`<span class="badge band-${wf.band}">${wf.band}</span>`:"")+stBadge;
    const rigTxt=wf.rigPrimary?("★ "+rigName(wf.rigPrimary)+(wf.rigBackup?"  ·  ☆ "+rigName(wf.rigBackup):"")):(t.rig||"");
    row.innerHTML=`<span class="sw" style="background:${t.color};color:${t.color}"></span>
      <span class="nm"><b class="fovlink" title="Open in FOV survey">${t.name}${t.cn?" · "+t.cn:""}</b><small>${rigTxt}</small></span>
      <a class="ab" href="${ABURL(t)}" target="_blank" rel="noopener" title="Search AstroBin">↗</a>
      ${badge}<span class="metric">${rk.darkH.toFixed(1)}h<small>max ${Math.round(rk.maxAlt)}°</small></span>`;
    row.querySelector(".ab").onclick=e=>e.stopPropagation();
    row.querySelector(".fovlink").onclick=e=>{e.stopPropagation(); frameById(t.id); setView("fov");};
    row.onclick=()=>{ on?S.enabled.delete(t.id):S.enabled.add(t.id); renderList(); redraw(); savePrefs(); };
    el.appendChild(row);}
}
function readouts(){$("clock").textContent=hhmm(S.scrubT);
  const j=jd(new Date(S.scrubT)),mrd=moonRaDec(j),m=altaz(mrd.ra,mrd.dec,j,S.night.site.lat,S.night.site.lon),lit=Math.round(moonLit(j)*100);
  $("moonline").textContent=m.alt<0?`moon down · ${lit}% lit`:`moon ${lit}% · alt ${Math.round(m.alt)}°`;}

/* =========================================================================
   RENDER / DRIVE
   ========================================================================= */
let rafPend=false;
function paint(){
  if(S.view==="fov"){ skybg.style.display="none"; drawFovBox(); if(TARGETS[S.fov.ti])drawMiniChart(TARGETS[S.fov.ti]); readouts(); return; }
  if(S.view==="sky") renderBackdrop(); else skybg.style.display="none";
  const {w,h}=fit(big,bctx);
  if(S.view==="chart") drawChart(bctx,w,h,false); else draw3D(bctx,w,h,false);
  const {w:pw,h:ph}=fit(pip,pctx);
  if(S.view==="chart") draw3D(pctx,pw,ph,true); else drawChart(pctx,pw,ph,true);
  readouts();
}
function redraw(){ if(rafPend)return; rafPend=true; requestAnimationFrame(()=>{rafPend=false;paint();}); }
function rebuild(){ buildNight(); buildTracks();
  if(S.enabled.size===0) S.rank.slice(0,6).forEach(r=>S.enabled.add(r.id));
  applySitePref();
  syncRail(); renderList(); redraw(); }
function syncRail(){ $("rail").value=Math.round(1000*(S.scrubT-S.night.start)/(S.night.stop-S.night.start)); }
function setTimeFromMs(ms){ S.scrubT=Math.max(S.night.start,Math.min(S.night.stop,ms)); syncRail(); redraw(); }

$("siteSel").onchange=e=>{S.site=e.target.value;S.scrubT=null;buildNight();buildTracks();applySitePref();syncRail();renderList();redraw();savePrefs();};
$("dateIn").onchange=()=>{S.scrubT=null;buildNight();buildTracks();syncRail();renderList();redraw();};
$("dateIn").addEventListener("click",function(){try{this.showPicker();}catch(e){}});
$("darkSel").onchange=e=>{S.dark=+e.target.value;buildNight();buildTracks();renderList();redraw();};
$("rail").oninput=e=>{S.scrubT=S.night.start+(e.target.value/1000)*(S.night.stop-S.night.start);redraw();};
$("allBtn").onclick=()=>{TARGETS.forEach(t=>S.enabled.add(t.id));renderList();redraw();savePrefs();};
$("noneBtn").onclick=()=>{S.enabled.clear();renderList();redraw();savePrefs();};
$("moonBtn").onclick=()=>{S.moonGlow=!S.moonGlow;$("moonBtn").classList.toggle("on",S.moonGlow);redraw();savePrefs();};
$("skyBtn").onclick=()=>{S.skyImg=!S.skyImg;$("skyBtn").classList.toggle("on",S.skyImg);redraw();savePrefs();};
$("rigBtn").onclick=()=>{S.rigColours=!S.rigColours;$("rigBtn").classList.toggle("on",S.rigColours);redraw();};
$("setPri").onclick=()=>setRig("rigPrimary");
$("setBak").onclick=()=>setRig("rigBackup");
$("wfExport").onclick=exportWorkflow;
document.querySelectorAll("#bandSeg button").forEach(b=>b.onclick=()=>setBand(b.dataset.b));
document.querySelectorAll("#statSeg button").forEach(b=>b.onclick=()=>setStatus(b.dataset.s));
$("fPrev").onclick=()=>step(-1);
$("tgtRename").onclick=()=>{ const t=TARGETS[S.fov.ti]; if(!t)return;
  const nn=prompt("Common name for "+t.name, t.cn||""); if(nn===null)return;
  t.cn=nn.trim(); S.wf[t.id]=Object.assign({},S.wf[t.id],{cn:t.cn}); saveWf();
  populateTargetUI(); $("fTgt").value=S.fov.ti; fovCompute(); renderList(); scrollCurrent(); };
$("tgtDelete").onclick=()=>{ const t=TARGETS[S.fov.ti]; if(!t)return;
  if(!confirm("Remove "+t.name+" from SkyPlan?\n(soft delete — it stays out via workflow.json and can be brought back by editing that file)"))return;
  S.wf[t.id]=Object.assign({},S.wf[t.id],{hidden:true}); saveWf();
  S.enabled.delete(t.id); TARGETS=TARGETS.filter(x=>x.id!==t.id);
  buildTracks(); populateTargetUI();
  if(TARGETS.length){ const ni=Math.min(S.fov.ti,TARGETS.length-1); S.fov._lastTi=-1; frameById(TARGETS[ni].id); }
  else { renderList(); redraw(); }
  savePrefs(); };
$("fNext").onclick=()=>step(1);
$("fltList").onchange=e=>{S.flt.list=e.target.value;renderList();};
$("fltBand").onchange=e=>{S.flt.band=e.target.value;renderList();};
$("fltStatus").onchange=e=>{S.flt.status=e.target.value;renderList();};
$("fltRig").onchange=e=>{S.flt.rig=e.target.value;renderList();};
$("sortSel").onchange=e=>{S.sortSel=e.target.value;renderList();};
$("fltSearch").oninput=e=>{S.flt.q=e.target.value.trim().toLowerCase();renderList();};
$("fltSel").onclick=()=>{S.flt.sel=!S.flt.sel;$("fltSel").classList.toggle("on",S.flt.sel);renderList();};
function savePlan(){ const name=(prompt("Name this plan","tonight")||"").trim(); if(!name)return;
  const sel=TARGETS.filter(t=>S.enabled.has(t.id)).map(t=>{ const w=S.wf[t.id]||{};
    const o={id:t.id,name:t.name,cn:t.cn,ra:t.ra,dec:t.dec,type:t.type};
    if(w.band)o.band=w.band; if(w.status)o.status=w.status;
    if(w.rigPrimary)o.rigPrimary=w.rigPrimary; if(w.rigBackup)o.rigBackup=w.rigBackup; return o; });
  const fn=name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"plan";
  const blob=new Blob([JSON.stringify({plan:name,generated:new Date().toISOString(),site:S.site,count:sel.length,targets:sel},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="plan-"+fn+".json";a.click();
}
function loadPlan(file){ const rd=new FileReader();
  rd.onload=()=>{ let p; try{p=JSON.parse(rd.result);}catch(e){alert("not valid JSON");return;}
    const arr=Array.isArray(p)?p:(p.targets||[]); if(!arr.length){alert("no targets in that file");return;}
    const have=new Set(TARGETS.map(t=>t.id)); const ids=arr.map(x=>x.id||x).filter(id=>have.has(id));
    S.enabled=new Set(ids); renderList(); redraw(); savePrefs();
    const miss=arr.length-ids.length;
    alert(`Loaded plan "${p.plan||file.name}" — ${ids.length} targets selected`+(miss?` (${miss} not in your catalogue, skipped)`:"")); };
  rd.readAsText(file);
}
$("planSave").onclick=savePlan;
$("planLoad").onclick=()=>$("planFile").click();
$("planFile").onchange=e=>{ if(e.target.files[0])loadPlan(e.target.files[0]); e.target.value=""; };
$("wfReload").onclick=()=>{ if(confirm("Reload workflow.json from the repo and DISCARD this device's unsaved workflow edits (rig/band/status/renames)?\n\nYour selected plan is kept.")){
  try{localStorage.removeItem("skyplan_wf");}catch(e){} location.reload(); } };

/* view switching */
const other=()=> S.view==="chart"?"sky":"chart";
function setView(v){ S.view=v;
  $("vChart").classList.toggle("on",v==="chart");$("vSky").classList.toggle("on",v==="sky");$("vFov").classList.toggle("on",v==="fov");
  big.className=(v==="sky"?"sky":"chart"); big.style.cursor=""; big.style.display=v==="fov"?"none":"block";
  $("al").style.display=v==="fov"?"block":"none";
  $("fovCtrls").style.display=v==="fov"?"flex":"none";
  $("lookTxt").style.display=v==="sky"?"block":"none";
  const showPip=(v!=="fov"); pip.style.display=showPip?"block":"none";
  $("pipLbl").style.display=showPip?"block":"none";
  $("pipLbl").textContent=showPip?(other()==="sky"?"▸ 3D sky":"▸ alt-time"):"";
  if(v==="fov"){ ensureAladin(); fovApply(true); }
  $("moonBtn").style.display=$("skyBtn").style.display=(v==="sky")?"":"none";
  $("rigBtn").style.display=(v==="chart")?"":"none";
  if(v==="sky") skyInit(); else skybg.style.display="none";
  redraw();
}
$("vChart").onclick=()=>setView("chart");
$("vSky").onclick=()=>setView("sky");
$("vFov").onclick=()=>setView("fov");
pip.addEventListener("click",()=>setView(other()));

/* FOV controls */
$("fTgt").onchange=e=>{frameById(TARGETS[+e.target.value].id);};
$("fScope").onchange=e=>{S.fov.scope=e.target.value;fovApply(true);};
$("fCam").onchange=e=>{S.fov.cam=e.target.value;fovApply(true);};
$("fPa").oninput=e=>{S.fov.pa=+e.target.value;$("fPaTxt").textContent=S.fov.pa+"°";fovCompute();drawFovBox();};

/* chart time drag (big only, chart view) */
function chartTimeAt(clientX){const r=big.getBoundingClientRect();
  const f=(clientX-r.left-CHART.L)/CHART.pw; return CHART.start+Math.max(0,Math.min(1,f))*(CHART.stop-CHART.start);}
let chartDrag=false;
big.addEventListener("mousedown",e=>{if(S.view!=="chart")return;chartDrag=true;setTimeFromMs(chartTimeAt(e.clientX));});
addEventListener("mousemove",e=>{if(chartDrag)setTimeFromMs(chartTimeAt(e.clientX));});
addEventListener("mouseup",()=>chartDrag=false);

/* 3D look drag + zoom + click-a-target→FOV (big only, sky view) */
let look=false,lx=0,ly=0,skyMoved=0;
function skyHitAt(px,py){ if(!S._skyHits)return null; let best=null,bd=1e9;
  for(const hc of S._skyHits){const d=Math.hypot(hc.x-px,hc.y-py); if(d<bd){bd=d;best=hc;}}
  return (best&&bd<=12)?best:null; }
big.addEventListener("mousedown",e=>{if(S.view!=="sky")return;look=true;lx=e.clientX;ly=e.clientY;skyMoved=0;});
addEventListener("mousemove",e=>{
  if(look){const dxp=e.clientX-lx,dyp=e.clientY-ly;lx=e.clientX;ly=e.clientY;skyMoved+=Math.abs(dxp)+Math.abs(dyp);
    const k=S.fov3d/big.clientHeight;
    S.look.az=((S.look.az - dxp*k)%360+360)%360; S.look.alt=Math.max(-5,Math.min(88,S.look.alt + dyp*k)); redraw(); return;}
  if(S.view==="sky"){const r=big.getBoundingClientRect();
    big.style.cursor = skyHitAt(e.clientX-r.left,e.clientY-r.top) ? "pointer" : "grab";}});
addEventListener("mouseup",e=>{
  if(look && S.view==="sky" && skyMoved<5){ const r=big.getBoundingClientRect();
    const h=skyHitAt(e.clientX-r.left,e.clientY-r.top);
    if(h){ frameById(TARGETS[h.ti].id); setView("fov"); } }
  look=false;});
big.addEventListener("wheel",e=>{if(S.view!=="sky")return;e.preventDefault();
  S.fov3d=Math.max(30,Math.min(120,S.fov3d+(e.deltaY>0?4:-4)));redraw();},{passive:false});

let playing=false,playTimer=null;
$("playBtn").onclick=()=>{playing=!playing;$("playBtn").classList.toggle("on",playing);
  $("playBtn").textContent=playing?"❚❚ pause":"▶ play";
  if(playing){playTimer=setInterval(()=>{let v=+$("rail").value+6;if(v>1000)v=0;$("rail").value=v;
    S.scrubT=S.night.start+(v/1000)*(S.night.stop-S.night.start);redraw();},80);}else clearInterval(playTimer);};
addEventListener("resize",redraw);
/* location panel + settings persistence */
function savePrefs(){ try{ const c=SITES.Custom;
  localStorage.setItem("skyplan",JSON.stringify({site:S.site,cLat:c?c.lat:null,cLon:c?c.lon:null,
    skyImg:S.skyImg,moonGlow:S.moonGlow,enabled:[...S.enabled]}));}catch(e){} }
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem("skyplan")||"{}");
  if(p.cLat!=null&&p.cLon!=null){ SITES.Custom={lat:p.cLat,lon:p.cLon,horizon:[]};
    $("customOpt").style.display=""; $("locLat").value=p.cLat; $("locLon").value=p.cLon; }
  if(p.site&&SITES[p.site]){ S.site=p.site; $("siteSel").value=p.site; }
  if(typeof p.skyImg==="boolean"){ S.skyImg=p.skyImg; $("skyBtn").classList.toggle("on",S.skyImg); }
  if(typeof p.moonGlow==="boolean"){ S.moonGlow=p.moonGlow; $("moonBtn").classList.toggle("on",S.moonGlow); }
  if(Array.isArray(p.enabled)){ S.enabled=new Set(p.enabled); }
}catch(e){} }
$("locBtn").onclick=()=>{ const on=$("locPanel").classList.toggle("show");
  if(on){ const s=SITES[S.site]; if(s){$("locLat").value=s.lat;$("locLon").value=s.lon;} $("locMsg").textContent=""; } };
$("locUse").onclick=()=>{ if(!navigator.geolocation){$("locMsg").textContent="geolocation not available";return;}
  $("locMsg").textContent="locating…";
  navigator.geolocation.getCurrentPosition(
    pos=>{$("locLat").value=pos.coords.latitude.toFixed(4);$("locLon").value=pos.coords.longitude.toFixed(4);
      $("locMsg").textContent="got it — press Apply";},
    err=>{$("locMsg").textContent="location denied/failed (needs https or localhost)";}); };
$("locApply").onclick=()=>{ const la=+$("locLat").value, lo=+$("locLon").value;
  if(!isFinite(la)||!isFinite(lo)){$("locMsg").textContent="enter valid numbers";return;}
  SITES.Custom={lat:la,lon:lo,horizon:[]}; $("customOpt").style.display="";
  S.site="Custom"; $("siteSel").value="Custom"; $("locPanel").classList.remove("show");
  S.scrubT=null; buildNight(); buildTracks(); syncRail(); renderList(); redraw(); savePrefs(); };

/* populate the FOV dropdowns from the (possibly external) data */
function populateTargetUI(){ const sel=$("fTgt"); sel.innerHTML="";
  TARGETS.forEach((t,i)=>{const o=document.createElement("option");o.value=i;o.textContent=t.name+(t.cn?" · "+t.cn:"");sel.appendChild(o);});
  if(S.fov.ti>=TARGETS.length)S.fov.ti=0; sel.value=S.fov.ti; }
function populateEquipUI(){
  const sc=$("fScope"); sc.innerHTML="";
  for(const [id,s] of Object.entries(SCOPES)){const o=document.createElement("option");o.value=id;o.textContent=s.n+" · "+s.f+" mm";sc.appendChild(o);}
  if(!SCOPES[S.fov.scope])S.fov.scope=Object.keys(SCOPES)[0]; sc.value=S.fov.scope;
  const cm=$("fCam"); cm.innerHTML="";
  for(const [id,c] of Object.entries(CAMS)){const o=document.createElement("option");o.value=id;o.textContent=c.n;cm.appendChild(o);}
  if(!CAMS[S.fov.cam])S.fov.cam=Object.keys(CAMS)[0]; cm.value=S.fov.cam;
}
/* Load external JSON if present (served), else use embedded defaults (file:// / sandbox). */
function tryJson(url){ return fetch(url).then(r=>r.ok?r.json():null).catch(()=>null); }
async function loadData(){
  const _n=new Date(); $("dateIn").value=new Date(_n.getTime()-_n.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const tj=await tryJson("targets.json");
  applyTargets(Array.isArray(tj)&&tj.length ? tj : DEFAULT_TARGETS);
  await loadWorkflow();
  TARGETS.forEach(t=>{ const w=S.wf[t.id]; if(w&&w.cn!=null)t.cn=w.cn; });
  TARGETS=TARGETS.filter(t=>!(S.wf[t.id]&&S.wf[t.id].hidden));
  const ej=await tryJson("equipment.json");
  if(ej&&ej.scopes&&Object.keys(ej.scopes).length) SCOPES=ej.scopes;
  if(ej&&ej.cameras&&Object.keys(ej.cameras).length) CAMS=ej.cameras;
  populateTargetUI(); populateEquipUI();
  loadPrefs();
  setView("chart"); rebuild();
}
loadData();
</script>
